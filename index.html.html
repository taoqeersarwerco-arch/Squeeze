<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squeeze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F4; --paper: #FFFFFF; --ink: #1A2233; --muted: #667085; --line: #DCE1E7;
    --accent: #3552E0; --accent-soft: #E8ECFD; --ok: #1F7A4D; --ok-soft: #E3F4EA; --warn: #A2410F; --warn-soft: #FDEEE4;
    --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 120px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-stretch: 125%; font-weight: 750; font-size: 1.25rem; letter-spacing: -0.01em; }
  .mark { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 5px; display: grid; place-items: center; }
  .mark::after { content: ""; width: 8px; height: 8px; background: var(--accent); border-radius: 2px; }

  .settings { position: relative; }
  .settings summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 0.9rem; }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary svg { transition: transform .15s; }
  .settings[open] summary svg { transform: rotate(180deg); }
  .panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(340px, calc(100vw - 40px)); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 16px; box-shadow: 0 12px 32px rgba(26, 34, 51, 0.12); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
  .seg button[aria-pressed="true"] { background: var(--paper); box-shadow: 0 1px 3px rgba(26, 34, 51, 0.12); font-weight: 600; }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; font-size: 0.9rem; }
  .field output { font-weight: 700; font-variant-numeric: tabular-nums; }
  .field input[type=range], .field select { grid-column: 1 / -1; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }

  .btn { border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 600; font-size: 0.9375rem; background: var(--ink); color: var(--paper); }
  .btn.primary { background: var(--accent); }
  .btn.quiet { background: transparent; color: var(--muted); font-weight: 500; padding: 10px 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .icon-btn[aria-disabled="true"] { opacity: 0.3; pointer-events: none; }

  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; }

  .drop { position: relative; display: grid; justify-items: center; gap: 10px; text-align: center; padding: 72px 24px; border: 2px dashed #C3CBD5; border-radius: 20px; background: var(--paper); cursor: pointer; transition: border-color .15s, background .15s, padding .25s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: #F7F8FF; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drop-title { font-stretch: 125%; font-weight: 750; font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.05; letter-spacing: -0.02em; max-width: 14ch; }
  .drop-sub { color: var(--muted); max-width: 42ch; }
  .drop .btn { margin-top: 8px; pointer-events: none; }
  body.has-items .drop { padding: 16px; grid-auto-flow: column; justify-content: center; align-items: center; border-radius: 14px; }
  body.has-items .drop-title { font-size: 1rem; font-stretch: 100%; font-weight: 600; letter-spacing: 0; max-width: none; }
  body.has-items .drop-sub, body.has-items .drop .btn { display: none; }

  #status { min-height: 1.4em; color: var(--muted); font-size: 0.875rem; margin: 10px 4px 0; }
  #list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 56px 1fr auto auto auto; gap: 14px; align-items: center; background: var(--paper); border-radius: 14px; padding: 10px 10px 10px 12px; }
  .thumb-btn { padding: 0; border: 0; background: var(--bg); border-radius: 10px; width: 56px; height: 56px; overflow: hidden; cursor: pointer; }
  .thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { min-width: 0; }
  .name { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .badge { font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .bar { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .5s ease; }
  .ratio { font-stretch: 125%; font-weight: 750; font-size: 1.625rem; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; min-width: 3.5ch; }
  .ratio.none { font-size: 0.875rem; font-weight: 500; font-stretch: 100%; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .item.working .bar span { width: 35%; background: #AEBBF3; animation: slide 1s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-20%); } to { transform: translateX(210%); } }
  }
  @media (prefers-reduced-motion: reduce) { .item.working .bar span { width: 50%; background: #AEBBF3; } }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: rgba(238, 241, 244, 0.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  .dock-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .dock-text { flex: 1; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dock-text strong { color: var(--ink); font-weight: 700; }

  dialog { border: 0; padding: 0; border-radius: 18px; width: min(1040px, 94vw); max-height: 92vh; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(26, 34, 51, 0.55); }
  .cmp-top { display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 18px; }
  .cmp-top strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-view { max-height: 62vh; overflow: auto; background: #D9DEE4; }
  .cmp-stage { position: relative; margin: 0 auto; cursor: ew-resize; touch-action: pan-y; user-select: none; }
  .cmp-stage img { display: block; width: 100%; height: auto; pointer-events: none; }
  .cmp-stage #cmp-b { position: absolute; inset: 0; height: 100%; clip-path: inset(0 0 0 50%); }
  .cmp-stage.zoom img { image-rendering: pixelated; }
  .cmp-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); pointer-events: none; }
  .cmp-line::after { content: ""; position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .tag { position: absolute; top: 10px; font-size: 0.75rem; font-weight: 600; background: rgba(26, 34, 51, 0.7); color: #fff; padding: 3px 9px; border-radius: 999px; pointer-events: none; }
  .tag.l { left: 10px; } .tag.r { right: 10px; }
  .cmp-slider { display: block; width: calc(100% - 36px); margin: 12px 18px 0; }
  .cmp-info { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 16px 18px 20px; font-size: 0.875rem; }
  .cmp-info h3 { font-size: 0.875rem; margin: 0 0 8px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .checks li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
  .checks .y { color: var(--ok); font-weight: 700; } .checks .n { color: var(--warn); font-weight: 700; }
  .checks small { color: var(--muted); }

  @media (max-width: 620px) {
    .item { grid-template-columns: 48px 1fr auto; gap: 10px; }
    .thumb-btn { width: 48px; height: 48px; }
    .ratio { grid-column: 3; grid-row: 1; }
    .item .dl, .item .rm { grid-row: 2; }
    .item .dl { grid-column: 2; justify-self: end; }
    .item .rm { grid-column: 3; justify-self: end; }
    .cmp-info { grid-template-columns: 1fr; }
    .settings summary span { max-width: 44vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Squeeze</div>
    <details class="settings" id="settings">
      <summary><span id="settings-summary">15× smaller, original size</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="panel">
        <div class="seg" role="group" aria-label="Goal">
          <button type="button" data-mode="size" aria-pressed="true">Target size</button>
          <button type="button" data-mode="quality" aria-pressed="false">Target quality</button>
        </div>
        <div class="field" id="size-field">
          <label for="ratio">Make files smaller by</label><output id="ratio-out">15×</output>
          <input type="range" id="ratio" min="2" max="30" step="1" value="15">
        </div>
        <div class="field" id="quality-field" hidden>
          <label for="sim">Result should look</label>
          <select id="sim">
            <option value="0.98">Identical to the original</option>
            <option value="0.95" selected>Very close to the original</option>
            <option value="0.90">Close, small loss is fine</option>
          </select>
        </div>
        <div class="field">
          <label for="maxedge">Dimensions</label>
          <select id="maxedge">
            <option value="0" selected>Keep original size</option>
            <option value="2560">Longest side 2560 px (WordPress default)</option>
            <option value="1920">Longest side 1920 px</option>
            <option value="1280">Longest side 1280 px</option>
          </select>
        </div>
        <div class="field">
          <label for="floor">Lowest quality allowed</label><output id="floor-out">40</output>
          <input type="range" id="floor" min="20" max="80" step="5" value="40">
        </div>
        <label class="check"><input type="checkbox" id="slug" checked> Web-friendly file names</label>
        <button type="button" class="btn" id="rerun" hidden>Apply to current files</button>
      </div>
    </details>
  </header>

  <div class="banner" id="unsupported" hidden>This browser can't create WebP files. Open this page in Chrome, Edge, or Firefox.</div>

  <label class="drop" id="drop">
    <input type="file" id="picker" accept=".png,.jpg,.jpeg,image/png,image/jpeg" multiple>
    <span class="drop-title" id="drop-title">Drop photos to shrink them</span>
    <span class="drop-sub">PNG or JPEG in, WebP out, at full resolution. Your files stay on this device.</span>
    <span class="btn primary">Choose files</span>
  </label>

  <p id="status" role="status" aria-live="polite"></p>
  <ul id="list"></ul>
</main>

<div class="dock" id="dock" hidden>
  <div class="dock-inner">
    <div class="dock-text" id="totals"></div>
    <button type="button" class="btn quiet" id="clear">Clear</button>
    <button type="button" class="btn primary" id="zip" disabled>Download all</button>
  </div>
</div>

<dialog id="cmp" aria-labelledby="cmp-title">
  <div class="cmp-top">
    <strong id="cmp-title"></strong>
    <label class="check"><input type="checkbox" id="cmp-zoom"> 100% zoom</label>
    <button type="button" class="icon-btn" id="cmp-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="cmp-view">
    <div class="cmp-stage" id="cmp-stage">
      <img id="cmp-a" alt="Original image"><img id="cmp-b" alt="Compressed WebP image">
      <div class="cmp-line" id="cmp-line"></div>
      <span class="tag l">Original</span><span class="tag r">WebP</span>
    </div>
  </div>
  <input type="range" class="cmp-slider" id="cmp-slider" min="0" max="100" step="0.5" value="50" aria-label="Divider position">
  <div class="cmp-info">
    <div><h3>Result</h3><dl id="cmp-stats"></dl></div>
    <div><h3>File check</h3><ul class="checks" id="cmp-checks"></ul></div>
  </div>
</dialog>

<script type="text/plain" id="worker-src">
const REF_MAX = 2048;
const WEBP_MAX = 16383;

function luma(src, w, h) {
  const c = new OffscreenCanvas(w, h);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const y = new Float32Array(w * h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) y[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  return y;
}

function ssim(a, b, w, h) {
  const C1 = 6.5025, C2 = 58.5225, B = 8, N = 64;
  let total = 0, n = 0;
  for (let by = 0; by + B <= h; by += 4) {
    for (let bx = 0; bx + B <= w; bx += 4) {
      let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
      for (let y = by; y < by + B; y++) {
        const r = y * w;
        for (let x = bx; x < bx + B; x++) {
          const p = a[r + x], q = b[r + x];
          sa += p; sb += q; saa += p * p; sbb += q * q; sab += p * q;
        }
      }
      const ma = sa / N, mb = sb / N;
      const va = saa / N - ma * ma, vb = sbb / N - mb * mb, cov = sab / N - ma * mb;
      total += ((2 * ma * mb + C1) * (2 * cov + C2)) / ((ma * ma + mb * mb + C1) * (va + vb + C2));
      n++;
    }
  }
  return n ? total / n : 1;
}

function drawScaled(src, W, H, w, h) {
  let cur = src, cw = W, ch = H;
  while (cw / 2 >= w && ch / 2 >= h) {
    const nw = Math.round(cw / 2), nh = Math.round(ch / 2);
    const c = new OffscreenCanvas(nw, nh);
    const x = c.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.drawImage(cur, 0, 0, nw, nh);
    cur = c; cw = nw; ch = nh;
  }
  const out = new OffscreenCanvas(w, h);
  const ctx = out.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(cur, 0, 0, w, h);
  return out;
}

function inspectWebP(buf, expW, expH) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  const tag = (o) => String.fromCharCode(u8[o], u8[o + 1], u8[o + 2], u8[o + 3]);
  const checks = [];
  const add = (label, pass, detail) => checks.push({ label, pass, detail: detail || '' });
  const info = { kind: 'unknown', alpha: false, animated: false, icc: false, exif: false, chunks: [] };

  if (u8.length < 20) {
    add('WebP file signature', false, 'File is too short to be an image');
    return { valid: false, checks, info };
  }
  add('WebP file signature', tag(0) === 'RIFF' && tag(8) === 'WEBP', 'RIFF container, WEBP type');
  const declared = dv.getUint32(4, true) + 8;
  add('File length matches header', declared === u8.length, `${u8.length.toLocaleString()} bytes`);

  const chunks = [];
  let off = 12, wellFormed = true;
  while (off + 8 <= u8.length) {
    const t = tag(off), sz = dv.getUint32(off + 4, true);
    const end = off + 8 + sz + (sz & 1);
    if (end > u8.length) { wellFormed = false; break; }
    chunks.push({ t, off: off + 8, sz });
    off = end;
  }
  if (off !== u8.length || chunks.length === 0) wellFormed = false;
  info.chunks = chunks.map((c) => c.t.trim());
  add('Chunks are well-formed', wellFormed, info.chunks.join(', '));

  let w = 0, h = 0, bitstreamOk = false;
  const first = chunks[0];
  if (first && first.t === 'VP8X' && first.sz >= 10) {
    const f = u8[first.off];
    info.icc = !!(f & 0x20); info.alpha = !!(f & 0x10); info.exif = !!(f & 0x08); info.animated = !!(f & 0x02);
    w = 1 + (u8[first.off + 4] | (u8[first.off + 5] << 8) | (u8[first.off + 6] << 16));
    h = 1 + (u8[first.off + 7] | (u8[first.off + 8] << 8) | (u8[first.off + 9] << 16));
  }
  const img = chunks.find((c) => c.t === 'VP8 ' || c.t === 'VP8L');
  if (img && img.t === 'VP8 ' && img.sz >= 10) {
    const o = img.off;
    const keyframe = (u8[o] & 1) === 0;
    bitstreamOk = keyframe && u8[o + 3] === 0x9d && u8[o + 4] === 0x01 && u8[o + 5] === 0x2a;
    const fw = dv.getUint16(o + 6, true) & 0x3fff, fh = dv.getUint16(o + 8, true) & 0x3fff;
    if (!w) { w = fw; h = fh; } else if (fw !== w || fh !== h) bitstreamOk = false;
    info.kind = 'lossy';
    if (chunks.some((c) => c.t === 'ALPH')) info.alpha = true;
  } else if (img && img.t === 'VP8L' && img.sz >= 5) {
    const o = img.off;
    const bits = dv.getUint32(o + 1, true);
    const fw = (bits & 0x3fff) + 1, fh = ((bits >>> 14) & 0x3fff) + 1;
    bitstreamOk = u8[o] === 0x2f && ((bits >>> 29) & 7) === 0;
    if (!w) { w = fw; h = fh; } else if (fw !== w || fh !== h) bitstreamOk = false;
    info.kind = 'lossless';
    if ((bits >>> 28) & 1) info.alpha = true;
  }
  add('Image data is valid', bitstreamOk, info.kind === 'unknown' ? 'No image chunk found' : `${info.kind === 'lossy' ? 'Lossy (VP8)' : 'Lossless (VP8L)'} bitstream`);
  add('Dimensions are correct', w === expW && h === expH, `${w} × ${h} px`);
  add('Still image', !info.animated, info.animated ? 'Animated files have patchier support' : 'Not animated');
  return { valid: checks.every((c) => c.pass), checks, info };
}

self.onmessage = async ({ data }) => {
  const { id, run, file, settings } = data;
  try {
    const bmp = await createImageBitmap(file);
    const W = bmp.width, H = bmp.height;
    let limit = WEBP_MAX;
    if (settings.maxEdge) limit = Math.min(limit, settings.maxEdge);
    const k = Math.min(1, limit / Math.max(W, H));
    const w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
    const canvas = drawScaled(bmp, W, H, w, h);
    bmp.close();
    const note = k < 1 && Math.max(W, H) > WEBP_MAX && (!settings.maxEdge || settings.maxEdge > WEBP_MAX)
      ? 'Scaled down to 16,383 px, the largest size WebP allows.' : '';

    const s = Math.min(1, REF_MAX / Math.max(w, h));
    const rw = Math.max(1, Math.round(w * s)), rh = Math.max(1, Math.round(h * s));
    const ref = luma(canvas, rw, rh);

    const cache = new Map();
    const at = async (q) => {
      q = Math.round(q * 100) / 100;
      let r = cache.get(q);
      if (!r) {
        const blob = await canvas.convertToBlob({ type: 'image/webp', quality: q });
        if (blob.type !== 'image/webp') throw new Error('NO_WEBP');
        r = { q, blob, size: blob.size, ssim: null };
        cache.set(q, r);
      }
      return r;
    };
    const score = async (r) => {
      if (r.ssim === null) {
        const b = await createImageBitmap(r.blob);
        r.ssim = ssim(ref, luma(b, rw, rh), rw, rh);
        b.close();
      }
      return r.ssim;
    };

    const floor = settings.minQ, ceil = 0.95;
    let best, reached = true;
    if (settings.mode === 'size') {
      const target = file.size / settings.ratio;
      const top = await at(ceil);
      if (top.size <= target) {
        best = top;
      } else {
        const bottom = await at(floor);
        if (bottom.size > target) { best = bottom; reached = false; }
        else {
          let lo = floor, hi = ceil; best = bottom;
          while (hi - lo > 0.015) {
            const mid = (lo + hi) / 2, r = await at(mid);
            if (r.size <= target) { best = r; lo = mid; } else { hi = mid; }
          }
        }
      }
    } else {
      const t = settings.ssimTarget;
      const bottom = await at(floor);
      if (await score(bottom) >= t) { best = bottom; }
      else {
        const top = await at(ceil);
        if (await score(top) < t) { best = top; reached = false; }
        else {
          let lo = floor, hi = ceil; best = top;
          while (hi - lo > 0.015) {
            const mid = (lo + hi) / 2, r = await at(mid);
            if (await score(r) >= t) { best = r; hi = mid; } else { lo = mid; }
          }
        }
      }
    }

    let decodes = true;
    try { await score(best); } catch (e) { decodes = false; }
    const check = inspectWebP(await best.blob.arrayBuffer(), w, h);
    check.checks.push({ label: 'Opens in this browser', pass: decodes, detail: decodes ? 'Decoded without errors' : 'The browser could not decode it' });
    check.valid = check.valid && decodes;

    self.postMessage({ id, run, blob: best.blob, size: best.size, q: best.q, ssim: best.ssim, srcW: W, srcH: H, w, h, reached, mode: settings.mode, note, check, encodes: cache.size });
  } catch (err) {
    self.postMessage({
      id, run,
      error: err && err.message === 'NO_WEBP'
        ? "This browser can't create WebP files. Use Chrome, Edge, or Firefox."
        : 'This image could not be read. It may be damaged, or too large for this device.'
    });
  }
};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const state = { mode: 'size', ratio: 15, ssimTarget: 0.95, minQ: 0.4, maxEdge: 0, slug: true };
const items = [];
let nextId = 1;

const ICON_DL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
const ICON_X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const simLabel = (v) => v >= 0.98 ? 'Looks identical' : v >= 0.95 ? 'Very close' : v >= 0.90 ? 'Minor loss' : 'Visible loss';
const say = (msg) => { $('#status').textContent = msg; };
const slugify = (s) => s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const outName = (item) => {
  const base = item.file.name.replace(/\.[^.]+$/, '');
  return (state.slug ? (slugify(base) || 'image-' + item.id) : base) + '.webp';
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const canWebP = (() => { const c = document.createElement('canvas'); c.width = c.height = 1; return c.toDataURL('image/webp').startsWith('data:image/webp'); })();
const canWorker = typeof OffscreenCanvas !== 'undefined' && 'convertToBlob' in OffscreenCanvas.prototype;
if (!canWebP || !canWorker) $('#unsupported').hidden = false;

const workerURL = URL.createObjectURL(new Blob([$('#worker-src').textContent], { type: 'text/javascript' }));
const poolSize = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
const workers = [];
const queue = [];

function makeWorker() {
  const w = new Worker(workerURL);
  w.job = null;
  w.onmessage = (e) => { w.job = null; onResult(e.data); pump(); };
  w.onerror = (ev) => {
    ev.preventDefault();
    const job = w.job;
    w.terminate();
    workers[workers.indexOf(w)] = makeWorker();
    if (job) onResult({ id: job.id, run: job.run, error: 'Processing failed. The image may be too large for this device.' });
    pump();
  };
  return w;
}
for (let i = 0; i < poolSize; i++) workers.push(makeWorker());

function pump() {
  for (const w of workers) {
    if (w.job) continue;
    const job = queue.shift();
    if (!job) break;
    w.job = job;
    w.postMessage(job);
  }
  updateDock();
}

function renderRow(item) {
  const li = document.createElement('li');
  li.className = 'item';
  li.innerHTML = `
    <button type="button" class="thumb-btn" aria-label="Compare ${esc(item.file.name)}"><img alt=""></button>
    <div class="info">
      <button type="button" class="name" title="${esc(item.file.name)}">${esc(item.file.name)}</button>
      <div class="line"><span class="sizes"></span><span class="badge" hidden></span></div>
      <div class="bar"><span></span></div>
    </div>
    <div class="ratio"></div>
    <a class="icon-btn dl" aria-label="Download ${esc(item.file.name)} as WebP" aria-disabled="true">${ICON_DL}</a>
    <button type="button" class="icon-btn rm" aria-label="Remove ${esc(item.file.name)}">${ICON_X}</button>`;
  li.querySelector('img').src = item.origURL;
  li.querySelector('.thumb-btn').addEventListener('click', () => openCompare(item));
  li.querySelector('.name').addEventListener('click', () => openCompare(item));
  li.querySelector('.rm').addEventListener('click', () => removeItem(item));
  li.querySelector('.dl').addEventListener('click', () => {
    if (item.result) li.querySelector('.dl').download = outName(item);
  });
  return li;
}

function setWorking(item) {
  const el = item.el;
  el.classList.add('working');
  el.querySelector('.sizes').textContent = `${fmt(item.file.size)}, compressing…`;
  el.querySelector('.badge').hidden = true;
  const r = el.querySelector('.ratio'); r.textContent = ''; r.className = 'ratio';
  el.querySelector('.bar span').style.width = '';
  const dl = el.querySelector('.dl'); dl.removeAttribute('href'); dl.setAttribute('aria-disabled', 'true');
}

function enqueue(item) {
  item.run++;
  item.result = null; item.error = null;
  if (item.outURL) { URL.revokeObjectURL(item.outURL); item.outURL = null; }
  setWorking(item);
  queue.push({ id: item.id, run: item.run, file: item.file, settings: { ...state } });
  pump();
}

function onResult(data) {
  const item = items.find((i) => i.id === data.id);
  if (!item || item.run !== data.run) return;
  const el = item.el;
  el.classList.remove('working');
  const badge = el.querySelector('.badge');
  if (data.error) {
    item.error = data.error;
    el.querySelector('.sizes').textContent = data.error;
    badge.hidden = false; badge.className = 'badge warn'; badge.textContent = 'Failed';
    updateDock();
    return;
  }
  item.result = data;
  item.outURL = URL.createObjectURL(data.blob);
  const ratio = item.file.size / data.size;
  el.querySelector('.bar span').style.width = Math.max(1, Math.min(100, (data.size / item.file.size) * 100)) + '%';
  el.querySelector('.sizes').textContent = `${fmt(item.file.size)} → ${fmt(data.size)}`;
  const r = el.querySelector('.ratio');
  if (ratio >= 1.05) { r.textContent = (ratio >= 10 ? ratio.toFixed(0) : ratio.toFixed(1)) + '×'; r.className = 'ratio'; }
  else { r.textContent = 'No gain'; r.className = 'ratio none'; }
  badge.hidden = false;
  if (!data.check.valid) { badge.className = 'badge warn'; badge.textContent = 'Check failed'; }
  else if (!data.reached || ratio < 1.05) { badge.className = 'badge warn'; badge.textContent = data.reached ? 'Keep original' : 'Target missed'; }
  else { badge.className = 'badge ok'; badge.textContent = 'Verified WebP'; }
  const dl = el.querySelector('.dl');
  dl.href = item.outURL; dl.download = outName(item); dl.removeAttribute('aria-disabled');
  updateDock();
}

function addFiles(list) {
  let skipped = 0;
  for (const file of list) {
    if (!/^image\/(png|jpeg)$/.test(file.type)) { skipped++; continue; }
    const item = { id: nextId++, file, run: 0, result: null, error: null, origURL: URL.createObjectURL(file), outURL: null };
    item.el = renderRow(item);
    $('#list').append(item.el);
    items.push(item);
    enqueue(item);
  }
  say(skipped ? `Skipped ${skipped} file${skipped > 1 ? 's' : ''}. Only PNG and JPEG can be converted.` : '');
  updateDock();
}

function removeItem(item) {
  item.run = -1;
  const qi = queue.findIndex((j) => j.id === item.id);
  if (qi >= 0) queue.splice(qi, 1);
  URL.revokeObjectURL(item.origURL);
  if (item.outURL) URL.revokeObjectURL(item.outURL);
  item.el.remove();
  items.splice(items.indexOf(item), 1);
  updateDock();
}

function updateDock() {
  const any = items.length > 0;
  document.body.classList.toggle('has-items', any);
  $('#drop-title').textContent = any ? 'Add more photos' : 'Drop photos to shrink them';
  $('#dock').hidden = !any;
  $('#rerun').hidden = !any;
  if (!any) return;
  const done = items.filter((i) => i.result);
  const pending = items.filter((i) => !i.result && !i.error).length;
  const before = done.reduce((s, i) => s + i.file.size, 0);
  const after = done.reduce((s, i) => s + i.result.size, 0);
  let html;
  if (pending) html = `Compressing ${done.length + 1} of ${items.length}…`;
  else if (done.length) html = `<strong>${fmt(before)} → ${fmt(after)}</strong>, ${Math.max(0, Math.round((1 - after / before) * 100))}% saved across ${done.length} file${done.length > 1 ? 's' : ''}`;
  else html = 'Nothing to download yet.';
  $('#totals').innerHTML = html;
  $('#zip').disabled = pending > 0 || done.length === 0;
  $('#zip').textContent = done.length === 1 ? 'Download' : 'Download all';
}

function triggerDownload(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$('#zip').addEventListener('click', async () => {
  const done = items.filter((i) => i.result);
  if (done.length === 1) { triggerDownload(done[0].result.blob, outName(done[0])); return; }
  if (typeof JSZip === 'undefined') {
    say('ZIP support could not load, so files will download one at a time.');
    for (const i of done) { triggerDownload(i.result.blob, outName(i)); await new Promise((r) => setTimeout(r, 300)); }
    return;
  }
  $('#zip').disabled = true; say('Building the ZIP…');
  const zip = new JSZip(); const used = new Set();
  for (const i of done) {
    const name = outName(i), base = name.slice(0, -5);
    let n = name, k = 2;
    while (used.has(n)) n = `${base}-${k++}.webp`;
    used.add(n);
    zip.file(n, i.result.blob);
  }
  triggerDownload(await zip.generateAsync({ type: 'blob' }), 'squeezed-webp.zip');
  say('');
  updateDock();
});

$('#clear').addEventListener('click', () => { [...items].forEach(removeItem); say(''); });
$('#rerun').addEventListener('click', () => { queue.length = 0; items.forEach(enqueue); $('#settings').open = false; });

function updateSummary() {
  const goal = state.mode === 'size' ? `${state.ratio}× smaller` : { '0.98': 'Looks identical', '0.95': 'Very close', '0.9': 'Close enough' }[String(state.ssimTarget)];
  const dims = state.maxEdge ? `max ${state.maxEdge} px` : 'original size';
  $('#settings-summary').textContent = `${goal}, ${dims}`;
}
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  $('#size-field').hidden = state.mode !== 'size';
  $('#quality-field').hidden = state.mode !== 'quality';
  updateSummary();
}));
$('#ratio').addEventListener('input', (e) => { state.ratio = +e.target.value; $('#ratio-out').textContent = e.target.value + '×'; updateSummary(); });
$('#sim').addEventListener('change', (e) => { state.ssimTarget = +e.target.value; updateSummary(); });
$('#maxedge').addEventListener('change', (e) => { state.maxEdge = +e.target.value; updateSummary(); });
$('#floor').addEventListener('input', (e) => { state.minQ = +e.target.value / 100; $('#floor-out').textContent = e.target.value; });
$('#slug').addEventListener('change', (e) => {
  state.slug = e.target.checked;
  items.forEach((i) => { if (i.result) i.el.querySelector('.dl').download = outName(i); });
});
document.addEventListener('click', (e) => { const s = $('#settings'); if (s.open && !s.contains(e.target)) s.open = false; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#settings').open = false; });

const drop = $('#drop');
$('#picker').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
['dragenter', 'dragover'].forEach((t) => window.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => window.addEventListener(t, (e) => { e.preventDefault(); if (t === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
window.addEventListener('drop', (e) => { if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });
window.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])]; if (f.length) addFiles(f); });

const dlg = $('#cmp'), stage = $('#cmp-stage'), slider = $('#cmp-slider');
let dragging = false;
function setDivider(v) {
  $('#cmp-b').style.clipPath = `inset(0 0 0 ${v}%)`;
  $('#cmp-line').style.left = v + '%';
  slider.value = v;
}
function fromPointer(e) {
  const r = stage.getBoundingClientRect();
  setDivider(Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100)));
}
stage.addEventListener('pointerdown', (e) => { dragging = true; stage.setPointerCapture(e.pointerId); fromPointer(e); });
stage.addEventListener('pointermove', (e) => { if (dragging) fromPointer(e); });
stage.addEventListener('pointerup', () => { dragging = false; });
stage.addEventListener('pointercancel', () => { dragging = false; });
slider.addEventListener('input', (e) => setDivider(+e.target.value));

function openCompare(item) {
  if (!item.result) return;
  const d = item.result;
  $('#cmp-title').textContent = item.file.name;
  $('#cmp-a').src = item.origURL;
  $('#cmp-b').src = item.outURL;
  $('#cmp-zoom').checked = false;
  stage.classList.remove('zoom');
  stage.style.width = '100%';
  dlg.dataset.w = d.w;
  setDivider(50);
  const resized = d.w !== d.srcW || d.h !== d.srcH;
  const i = d.check.info;
  const rows = [
    ['Size', `${fmt(item.file.size)} → ${fmt(d.size)}`],
    ['Dimensions', resized ? `${d.srcW} × ${d.srcH} → ${d.w} × ${d.h} px` : `${d.w} × ${d.h} px, unchanged`],
    ['Quality used', `${Math.round(d.q * 100)} of 100, found in ${d.encodes} tries`],
    ['Similarity', `${d.ssim.toFixed(3)} SSIM, ${simLabel(d.ssim).toLowerCase()}`],
    ['Encoding', `${i.kind === 'lossless' ? 'Lossless' : 'Lossy'}${i.alpha ? ', with transparency' : ''}`],
    ['Color and metadata', `sRGB, ${i.exif || i.icc ? 'metadata kept' : 'metadata removed'}`],
  ];
  if (!d.reached) rows.push(['Note', d.mode === 'size' ? 'Target size needs a quality below your minimum.' : 'Similarity target not met even at quality 95.']);
  if (d.note) rows.push(['Note', d.note]);
  $('#cmp-stats').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  $('#cmp-checks').innerHTML = d.check.checks.map((c) =>
    `<li><span class="${c.pass ? 'y' : 'n'}" aria-label="${c.pass ? 'Passed' : 'Failed'}">${c.pass ? '✓' : '✕'}</span><span>${esc(c.label)}<br><small>${esc(c.detail)}</small></span></li>`).join('');
  dlg.showModal();
}
$('#cmp-zoom').addEventListener('change', (e) => {
  stage.classList.toggle('zoom', e.target.checked);
  stage.style.width = e.target.checked ? dlg.dataset.w + 'px' : '100%';
});
$('#cmp-close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
