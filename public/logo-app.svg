<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101217" />
      <stop offset="100%" stop-color="#08090B" />
    </linearGradient>

    <!-- Top Specular Highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Inner Ambient Glass Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
  <line x1="120" y1="20" x2="392" y2="20" stroke="url(#highlight)" stroke-width="3" />

  <!-- Logo Mark Scaled (24x24 -> 280x280 centered) -->
  <g transform="translate(116, 116) scale(11.6667)">
    <!-- Left Caliper Bracket -->
    <path
      d="M7 4.5H5C4.17157 4.5 3.5 5.17157 3.5 6V18C3.5 18.8284 4.17157 19.5 5 19.5H7"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Right Caliper Bracket -->
    <path
      d="M17 4.5H19C19.8284 4.5 20.5 5.17157 20.5 6V18C20.5 18.8284 19.8284 19.5 19 19.5H17"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Compression Monogram 'S' -->
    <path
      d="M14.75 8.25C14.75 6.75 13.55 5.5 11.9 5.5C10.15 5.5 9 6.7 9 8.2C9 11.25 15 10.85 15 15.5C15 17.2 13.6 18.5 11.85 18.5C9.85 18.5 8.85 17.15 8.85 15.5"
      stroke="#FFFFFF"
      stroke-width="2.15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Precision Sparkle Core -->
    <circle cx="12" cy="12" r="0.85" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
